# Full config: publication-quality budgets. Expected ~2-3 h on Colab CPU;
# all long loops are checkpointed and resumable (--resume).
# Historical 2005 educational audit. Not for lending decisions. Not financial advice.

run:
  name: full
  seed: 42

data:
  source: uci_static
  split: {train: 0.70, val: 0.15, test: 0.15}
  synthetic_rows: 4000
  local_cases_per_class: 8

models:
  logistic: {C: 1.0, max_iter: 2000}
  ebm: {max_bins: 256, interactions: 10, outer_bags: 8, max_rounds: 5000}
  lightgbm:
    n_estimators: 2000
    num_leaves: 31
    learning_rate: 0.03
    min_child_samples: 50
    early_stopping_rounds: 100
    num_threads: 4

calibration:
  methods: [sigmoid, isotonic]
  selection_metric: log_loss

evaluation:
  bootstrap: {n_iterations: 1000, checkpoint_every: 50, ci_level: 0.95}
  ece_bins: 15
  latency: {n_warmup: 3, n_repeats: 10, per_row_samples: 200}

explain:
  shap: {background_size: 1000, test_sample_size: 4500}
  top_k: 10
  rank_stability: {n_refits: 20, n_resamples: 200}
  faithfulness: {n_instances: 2000, n_draws: 10}

fairness:
  sex_column: SEX
  age_bins: [[21, 29], [30, 39], [40, 49], [50, 59], [60, null]]
  small_cell_min: 20

serve:
  model: lightgbm
  host: 127.0.0.1
  port: 8000
