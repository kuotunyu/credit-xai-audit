name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: python scripts/setup_environment.py
      - run: uv run --no-sync ruff check src app tests
      - run: uv run --no-sync ruff format --check src app tests
      - run: uv run --no-sync mypy --strict src app
      - run: uv run --no-sync python -m credit_xai.release.verify all
      - run: uv run --no-sync python -m build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: python scripts/setup_environment.py
      # network-marked tests are excluded by default: CI never downloads the
      # real UCI dataset; the end-to-end tests run on the synthetic source
      - run: uv run --no-sync pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker compose build api
      - name: CPU smoke pipeline on synthetic data (no network, no dataset)
        run: docker compose --profile smoke run --rm smoke
      - name: start API and check /health
        run: |
          docker compose up -d api
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 2
          done
          [ "${ok:-0}" = "1" ] || (docker compose logs api && exit 1)
          docker compose down
