[project]
name = "credit-xai-audit"
version = "0.1.0"
description = "Historical 2005 educational XAI audit of the UCI Default of Credit Card Clients dataset. Not for lending decisions. Not financial advice."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.6,<1.8",
    "shap>=0.46,<0.49",
    "matplotlib>=3.8",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "xlrd>=2.0,<3",
    "joblib>=1.3",
    "pyarrow>=15",
    "requests>=2.31",
    "ucimlrepo>=0.0.7",
]

[project.optional-dependencies]
ebm = ["interpret-core>=0.6.10,<0.8"]
lightgbm = ["lightgbm>=4.3,<5"]
serve = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.29",
    "gradio>=6.20,<7",
]

[dependency-groups]
dev = [
    "build>=1.2,<2",
    "pytest>=8.0",
    "httpx>=0.27",
    "mypy>=1.17,<2",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.scripts]
credit-xai = "credit_xai.cli:main"
credit-xai-verify = "credit_xai.release.verify:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_xai"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/app",
    "/configs",
    "/manifests",
    "/scripts",
    "/CHANGELOG.md",
    "/CITATION.cff",
    "/DATA_CARD.md",
    "/LICENSE",
    "/MODEL_CARD.md",
    "/README.md",
    "/README_zh-TW.md",
    "/SECURITY.md",
    "/pyproject.toml",
    "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network' -q"
markers = [
    "network: tests that download the real UCI dataset (excluded by default)",
    "slow: long-running tests",
    "installation: creates an isolated environment to verify packaging portability",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]
extend-exclude = ["notebooks"]  # thin wrappers with Colab shell magics

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
ignore_missing_imports = true
mypy_path = "src"
files = ["src", "app"]
